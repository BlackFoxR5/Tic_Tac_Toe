<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup">
        <h1>Tic Tac Toe</h1>
        <input type="text" id="player1" placeholder="Player 1 name" maxlength="20" autocomplete="off" />
        <input type="text" id="player2" placeholder="Player 2 name" maxlength="20" autocomplete="off" />
        <button id="startBtn">Start Game</button>
    </div>

    <!-- Game Screen -->
    <div id="game">
        <h1>Tic Tac Toe</h1>
        <div id="scoreboard" aria-live="polite">
            <span id="score-p1">Player 1: 0</span>
            <span id="score-divider"> | </span>
            <span id="score-p2">Player 2: 0</span>
        </div>
        <div id="message" aria-live="polite"></div>
        <div id="board" role="grid" aria-label="Tic Tac Toe board"></div>
        <button id="restart">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
